<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail &bull; David Renoult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Mode sombre YouTube & Gris de Payne */
      --bg-youtube: #0f1013;
      --payne-dark: #1b2129;
      --payne-base: #28313d;
      --payne-light: #3d4a5c;
      --payne-accent: #52637a;

      /* Accents sobres */
      --gold-muted: #c9ab73;
      --gold-subtle: rgba(201, 171, 115, 0.25);
      --text-main: #f1f3f5;
      --text-muted: #9aa4b2;
      --border-card: rgba(82, 99, 122, 0.25);
      --border-card-hover: rgba(201, 171, 115, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-youtube);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Halo ambiant en Gris de Payne discret en arrière-plan */
    body::before {
      content: "";
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 600px;
      background: radial-gradient(circle, rgba(40, 49, 61, 0.45) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* En-tête sobre & classique */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    header p {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--gold-muted);
      text-transform: uppercase;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-muted), transparent);
      margin: 1.25rem auto 0;
    }

    /* Grille des 5 cartes */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.75rem;
      width: 100%;
      justify-content: center;
    }

    /* Carte de chaque univers */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.25rem 1.5rem;
      background: linear-gradient(180deg, var(--payne-dark) 0%, #12151a 100%);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
    }

    /* Emplacement réservé pour les futures photos de fond (flou & fondu) */
    .card .card-bg-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.25);
      opacity: 0.35;
      transform: scale(1.1);
      transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
      z-index: 1;
      pointer-events: none;
    }

    .card:hover .card-bg-photo {
      filter: blur(5px) brightness(0.35);
      opacity: 0.55;
      transform: scale(1.15);
    }

    /* Contenu au-dessus du fond */
    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--border-card-hover);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55),
                  0 0 20px rgba(61, 74, 92, 0.3);
    }

    /* Médaillon / Icône avec effet de pulsation */
    .icon-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulsation lumineuse subtile en arrière de l'icône */
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      border: 1px solid rgba(201, 171, 115, 0.4);
      opacity: 0;
      transform: scale(0.9);
      animation: elegant-pulse 3s infinite cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    @keyframes elegant-pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.7;
        border-color: rgba(201, 171, 115, 0.5);
      }
      50% {
        transform: scale(1.22);
        opacity: 0;
        border-color: rgba(82, 99, 122, 0.2);
      }
      100% {
        transform: scale(1.25);
        opacity: 0;
      }
    }

    /* Décalage temporel des pulsations selon la carte */
    .card:nth-child(2) .pulse-ring { animation-delay: 0.6s; }
    .card:nth-child(3) .pulse-ring { animation-delay: 1.2s; }
    .card:nth-child(4) .pulse-ring { animation-delay: 1.8s; }
    .card:nth-child(5) .pulse-ring { animation-delay: 2.4s; }

    /* Conteneur de l'image : coins arrondis stricts sans marge */
    .icon-box {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #0b0d10;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .card:hover .icon-box {
      border-color: var(--gold-muted);
      transform: scale(1.04);
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Remplit parfaitement le carré arrondi sans laisser de marges */
      display: block;
    }

    /* Typographie des titres */
    .card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .card:hover .card-title {
      color: var(--gold-muted);
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 580px) {
      header h1 {
        font-size: 2.2rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Carnets & Panoramas</h1>
      <p>Explorations et collections</p>
      <div class="divider"></div>
    </header>

    <main class="grid">

      <!-- 1. ARTS -->
      <a href="https://renoultdavid.github.io/panoramadesarts/" class="card" target="_blank" rel="noopener noreferrer">
        <!-- Emplacement réservé pour l'image de fond floue -->
        <div class="card-bg-photo" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1Iusf2_1rofp1omU_xyBsym6L1qGvgM4U&sz=w256" alt="Arts">
            </div>
          </div>
          <h2 class="card-title">Arts</h2>
          <span class="card-label">Panorama des Arts</span>
        </div>
      </a>

      <!-- 2. ASTRONOMIE -->
      <a href="https://renoultdavid.github.io/astronomie/" class="card" target="_blank" rel="noopener noreferrer">
        <div class="card-bg-photo" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=106ZOMM6JXFy9R2EZkhP4C-5SdPbFxGTc&sz=w256" alt="Astronomie">
            </div>
          </div>
          <h2 class="card-title">Astronomie</h2>
          <span class="card-label">Observations & Espace</span>
        </div>
      </a>

      <!-- 3. LIVRES -->
      <a href="https://renoultdavid.github.io/panoramadeslivres/" class="card" target="_blank" rel="noopener noreferrer">
        <div class="card-bg-photo" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1OZEecC8ng2-J_ozp7RY1f6Yll1qF4cHR&sz=w256" alt="Livres">
            </div>
          </div>
          <h2 class="card-title">Livres</h2>
          <span class="card-label">Panorama des Livres</span>
        </div>
      </a>

      <!-- 4. NATURE -->
      <a href="https://renoultdavid.github.io/labotaxonomie/" class="card" target="_blank" rel="noopener noreferrer">
        <div class="card-bg-photo" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1DJ4sHJcdm3gkXE9g9nJVFqehG3Fxb60R&sz=w256" alt="Nature">
            </div>
          </div>
          <h2 class="card-title">Nature</h2>
          <span class="card-label">Labo Taxonomie</span>
        </div>
      </a>

      <!-- 5. VOYAGES -->
      <a href="https://renoultdavid.github.io/voyages/" class="card" target="_blank" rel="noopener noreferrer">
        <div class="card-bg-photo" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1lgp1GbPphO66fZsHQ3w3O0XwILIcydLo&sz=w256" alt="Voyages">
            </div>
          </div>
          <h2 class="card-title">Voyages</h2>
          <span class="card-label">Itinéraires & Découvertes</span>
        </div>
      </a>

    </main>
  </div>

</body>
</html>
