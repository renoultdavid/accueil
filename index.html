<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail &bull; David Renoult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-youtube: #0f1013;
      --payne-dark: #1a2027;
      --payne-base: #28323e;
      --payne-light: #3d4a5c;
      --gold-accent: #c9ab73;
      --text-main: #f5f6f8;
      --text-muted: #9aa4b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-youtube);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambiance d'arrière-plan Gris de Payne */
    body::before {
      content: "";
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(circle, rgba(40, 50, 62, 0.45) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* En-tête */
    header {
      text-align: center;
      margin-bottom: 2rem;
      z-index: 2;
    }

    header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: var(--gold-accent);
      text-transform: uppercase;
    }

    /* Théâtre du carrousel */
    .carousel-stage {
      position: relative;
      width: 100%;
      max-width: 1300px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      z-index: 1;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Carte format ample */
    .card {
      position: absolute;
      width: 380px;
      height: 520px;
      background: linear-gradient(180deg, var(--payne-dark) 0%, #12151b 100%);
      border: 1px solid rgba(82, 99, 122, 0.28);
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 3rem 2rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
    }

    /* Image de fond avec estompe & flou classe */
    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.35);
      transform: scale(1.15);
      transition: filter 0.5s ease, brightness 0.5s ease;
      z-index: 1;
    }

    /* Voile dégradé noir & Gris de Payne par-dessus le fond */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 16, 19, 0.2) 0%, rgba(20, 25, 32, 0.85) 60%, rgba(15, 16, 19, 0.98) 100%);
      z-index: 2;
    }

    .card-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    /* Médaillon / Icône */
    .icon-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulsation rythmée autour de l'icône */
    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      border: 1px solid rgba(201, 171, 115, 0.6);
      opacity: 0;
      animation: elegant-pulse 3.2s infinite cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    @keyframes elegant-pulse {
      0% {
        transform: scale(0.96);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.22);
        opacity: 0;
      }
      100% {
        transform: scale(1.25);
        opacity: 0;
      }
    }

    .icon-box {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      overflow: hidden;
      background-color: #0b0d10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Typographie */
    .card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .card-action {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      border: 1px solid var(--gold-accent);
      border-radius: 30px;
      color: var(--gold-accent);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    /* États du carrousel (Positionnement 3D Coverflow) */
    .card[data-pos="0"] {
      transform: translateX(0) translateZ(140px) scale(1);
      z-index: 10;
      opacity: 1;
      filter: none;
      border-color: rgba(201, 171, 115, 0.45);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(40, 50, 62, 0.5);
    }

    .card[data-pos="0"] .card-action {
      opacity: 1;
      transform: translateY(0);
    }

    .card[data-pos="0"]:hover .card-bg {
      filter: blur(6px) brightness(0.45);
    }

    .card[data-pos="-1"] {
      transform: translateX(-310px) translateZ(0) rotateY(18deg) scale(0.85);
      z-index: 5;
      opacity: 0.65;
      filter: brightness(0.7);
    }

    .card[data-pos="1"] {
      transform: translateX(310px) translateZ(0) rotateY(-18deg) scale(0.85);
      z-index: 5;
      opacity: 0.65;
      filter: brightness(0.7);
    }

    .card[data-pos="-2"] {
      transform: translateX(-560px) translateZ(-80px) rotateY(32deg) scale(0.72);
      z-index: 2;
      opacity: 0.35;
      filter: brightness(0.5);
    }

    .card[data-pos="2"] {
      transform: translateX(560px) translateZ(-80px) rotateY(-32deg) scale(0.72);
      z-index: 2;
      opacity: 0.35;
      filter: brightness(0.5);
    }

    /* Commandes discrètes de navigation */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(26, 32, 39, 0.65);
      border: 1px solid rgba(82, 99, 122, 0.35);
      color: var(--text-main);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: background 0.3s ease, border-color 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .nav-btn:hover {
      background: var(--payne-base);
      border-color: var(--gold-accent);
      color: var(--gold-accent);
    }

    .nav-prev { left: 2rem; }
    .nav-next { right: 2rem; }

    @media (max-width: 900px) {
      .card { width: 300px; height: 440px; }
      .card[data-pos="-1"] { transform: translateX(-180px) scale(0.8); }
      .card[data-pos="1"] { transform: translateX(180px) scale(0.8); }
      .card[data-pos="-2"], .card[data-pos="2"] { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Carnets & Panoramas</h1>
    <p>Explorations et collections</p>
  </header>

  <div class="carousel-stage">
    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Précédent">&#10094;</button>

    <div class="carousel-track" id="track">

      <!-- 0. ARTS -->
      <div class="card" data-url="https://renoultdavid.github.io/panoramadesarts/">
        <div class="card-bg" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1Iusf2_1rofp1omU_xyBsym6L1qGvgM4U&sz=w256" alt="Arts">
            </div>
          </div>
          <h2 class="card-title">Arts</h2>
          <span class="card-desc">Panorama des Arts</span>
          <span class="card-action">Entrer</span>
        </div>
      </div>

      <!-- 1. ASTRONOMIE (Placé au centre par défaut pour commencer) -->
      <div class="card" data-url="https://renoultdavid.github.io/astronomie/">
        <!-- Collez l'URL de l'image de fond ici -->
        <div class="card-bg" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=106ZOMM6JXFy9R2EZkhP4C-5SdPbFxGTc&sz=w256" alt="Astronomie">
            </div>
          </div>
          <h2 class="card-title">Astronomie</h2>
          <span class="card-desc">Observations & Univers</span>
          <span class="card-action">Entrer</span>
        </div>
      </div>

      <!-- 2. LIVRES -->
      <div class="card" data-url="https://renoultdavid.github.io/panoramadeslivres/">
        <div class="card-bg" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1OZEecC8ng2-J_ozp7RY1f6Yll1qF4cHR&sz=w256" alt="Livres">
            </div>
          </div>
          <h2 class="card-title">Livres</h2>
          <span class="card-desc">Panorama des Livres</span>
          <span class="card-action">Entrer</span>
        </div>
      </div>

      <!-- 3. NATURE -->
      <div class="card" data-url="https://renoultdavid.github.io/labotaxonomie/">
        <div class="card-bg" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1DJ4sHJcdm3gkXE9g9nJVFqehG3Fxb60R&sz=w256" alt="Nature">
            </div>
          </div>
          <h2 class="card-title">Nature</h2>
          <span class="card-desc">Labo Taxonomie</span>
          <span class="card-action">Entrer</span>
        </div>
      </div>

      <!-- 4. VOYAGES -->
      <div class="card" data-url="https://renoultdavid.github.io/voyages/">
        <div class="card-bg" style="background-image: url('');"></div>
        <div class="card-content">
          <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-box">
              <img src="https://drive.google.com/thumbnail?id=1lgp1GbPphO66fZsHQ3w3O0XwILIcydLo&sz=w256" alt="Voyages">
            </div>
          </div>
          <h2 class="card-title">Voyages</h2>
          <span class="card-desc">Itinéraires & Découvertes</span>
          <span class="card-action">Entrer</span>
        </div>
      </div>

    </div>

    <button class="nav-btn nav-next" id="nextBtn" aria-label="Suivant">&#10095;</button>
  </div>

  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    // Index actif initial : 1 (Astronomie)
    let currentIndex = 1;
    const total = cards.length;

    function updateCarousel() {
      cards.forEach((card, i) => {
        // Calcul de la distance relative dans un cycle fermé (-2, -1, 0, 1, 2)
        let diff = (i - currentIndex) % total;
        if (diff > 2) diff -= total;
        if (diff < -2) diff += total;

        card.setAttribute('data-pos', diff);
      });
    }

    function rotateNext() {
      currentIndex = (currentIndex + 1) % total;
      updateCarousel();
    }

    function rotatePrev() {
      currentIndex = (currentIndex - 1 + total) % total;
      updateCarousel();
    }

    // Clic sur les boutons
    nextBtn.addEventListener('click', rotateNext);
    prevBtn.addEventListener('click', rotatePrev);

    // Clic sur une carte : si centrale -> ouvre le lien, si latérale -> pivote au centre
    cards.forEach((card, index) => {
      card.addEventListener('click', () => {
        const pos = parseInt(card.getAttribute('data-pos'), 10);
        if (pos === 0) {
          window.open(card.getAttribute('data-url'), '_blank');
        } else {
          currentIndex = index;
          updateCarousel();
        }
      });
    });

    // Support des flèches clavier
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') rotateNext();
      if (e.key === 'ArrowLeft') rotatePrev();
    });

    updateCarousel();
  </script>
</body>
</html>
